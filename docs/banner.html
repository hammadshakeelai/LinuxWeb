<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 320px; background: #d9d2c0; font-family: Tahoma, Verdana, sans-serif; }
  .window { position: absolute; left: 40px; top: 36px; width: 1200px; height: 248px; background: #c9c1ad; border: 3px solid; border-color: #f4efe2 #8a8472 #8a8472 #f4efe2; }
  .title { background: linear-gradient(90deg, #000080, #1084d0); color: #fff; font-weight: bold; font-size: 22px; padding: 8px 14px; }
  .body { display: flex; gap: 28px; padding: 18px 22px; }
  .copy h1 { margin: 0; font-size: 56px; color: #1d1d1d; letter-spacing: -0.01em; }
  .copy p { margin: 10px 0 0; font-size: 22px; color: #3d3a30; max-width: 470px; }
  .screen { flex: 1; background: #101010; border: 3px solid; border-color: #8a8472 #f4efe2 #f4efe2 #8a8472; padding: 14px 18px; font: 18px/1.55 Consolas, "DejaVu Sans Mono", monospace; color: #d6d6d6; }
  .prompt { color: #8fd18f; }
</style>
</head>
<body>
  <div class="window">
    <div class="title">LinuxWeb: Alpine Linux 3.21</div>
    <div class="body">
      <div class="copy">
        <h1>LinuxWeb</h1>
        <p>Real Alpine Linux in your browser tab. Your home folder is saved automatically.</p>
      </div>
      <div class="screen">
        Welcome to LinuxWeb: Alpine Linux, running in your browser.<br>
        <span class="prompt">localhost:~#</span> python3 -c 'print("hello")'<br>
        hello<br>
        <span class="prompt">localhost:~#</span> &#9608;
      </div>
    </div>
  </div>
</body>
</html>
